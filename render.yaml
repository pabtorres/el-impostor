services:
  - type: web
    name: impostor-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production

  - type: web
    name: impostor-frontend
    env: static
    buildCommand: cd frontend && npm install && VITE_BACKEND_URL=https://impostor-backend.onrender.com npm run build
    staticPublishPath: frontend/dist
